name: 'Deploy AUR Package'
description: >
  Publishes a PKGBUILD to AUR. Tries KSXGitHub/github-actions-deploy-aur first,
  falls back to a manual clone-and-push with .SRCINFO regeneration via Docker.

inputs:
  pkgname:
    description: 'AUR package name'
    required: true
  pkgbuild:
    description: 'Path to the PKGBUILD file'
    required: true
  ssh_private_key:
    description: 'SSH private key with AUR access'
    required: true
  commit_username:
    description: 'Git commit username'
    required: true
  commit_email:
    description: 'Git commit email'
    required: true
  commit_message:
    description: 'Git commit message'
    required: true
  force_push:
    description: 'Force push to AUR'
    required: false
    default: 'false'
  regenerate_srcinfo:
    description: 'Regenerate .SRCINFO via Docker in the manual fallback (needed for -git packages)'
    required: false
    default: 'false'
  updpkgsums:
    description: 'Run updpkgsums after copying PKGBUILD (requires pacman-contrib in the Action environment)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Deploy via AUR Action (primary)
      id: aur_action
      continue-on-error: true
      uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
      with:
        pkgname: ${{ inputs.pkgname }}
        pkgbuild: ${{ inputs.pkgbuild }}
        commit_username: ${{ inputs.commit_username }}
        commit_email: ${{ inputs.commit_email }}
        ssh_private_key: ${{ inputs.ssh_private_key }}
        commit_message: ${{ inputs.commit_message }}
        force_push: ${{ inputs.force_push }}
        ssh_keyscan_types: rsa,ecdsa,ed25519
        updpkgsums: ${{ inputs.updpkgsums }}

    - name: Setup SSH key for fallback
      if: steps.aur_action.outcome == 'failure'
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        # Passed via env: inline expression expansion would place the key into the generated script file.
        (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aur_key)
        cat >> ~/.ssh/config << 'EOF'
        Host aur.archlinux.org
          IdentityFile ~/.ssh/aur_key
          User aur
          StrictHostKeyChecking accept-new
        EOF

    - name: Deploy via manual push (fallback)
      id: aur_manual
      continue-on-error: true
      if: steps.aur_action.outcome == 'failure'
      shell: bash
      # Inputs are passed via env instead of inline expression expansion to prevent script injection
      # (e.g. through commit messages).
      env:
        PKGNAME: ${{ inputs.pkgname }}
        PKGBUILD_PATH: ${{ inputs.pkgbuild }}
        COMMIT_USERNAME: ${{ inputs.commit_username }}
        COMMIT_EMAIL: ${{ inputs.commit_email }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
        FORCE_PUSH: ${{ inputs.force_push }}
        REGENERATE_SRCINFO: ${{ inputs.regenerate_srcinfo }}
        UPDPKGSUMS: ${{ inputs.updpkgsums }}
      run: |
        set -euo pipefail
        echo "::warning::AUR Action failed, falling back to manual push"

        cd /tmp
        rm -rf aur-deploy
        mkdir aur-deploy
        cd aur-deploy
        git clone "ssh://aur@aur.archlinux.org/${PKGNAME}.git" .
        git checkout -B master origin/master

        cp "$GITHUB_WORKSPACE/$PKGBUILD_PATH" ./PKGBUILD

        if [[ "$UPDPKGSUMS" == "true" ]]; then
          if command -v updpkgsums >/dev/null 2>&1; then
            updpkgsums PKGBUILD
          else
            echo "::warning::updpkgsums requested but pacman-contrib is not installed in the fallback environment; sha256sums left unchanged"
          fi
        fi

        if [[ "$REGENERATE_SRCINFO" == "true" ]]; then
          docker run --rm -v "$(pwd)":/pkg archlinux:latest \
            bash -c "useradd -m builder \
              && cp /pkg/PKGBUILD /home/builder/ \
              && su builder -c 'cd /home/builder && makepkg --printsrcinfo > /pkg/.SRCINFO'"
        fi

        git config user.name "$COMMIT_USERNAME"
        git config user.email "$COMMIT_EMAIL"

        git add PKGBUILD
        if [[ "$REGENERATE_SRCINFO" == "true" ]]; then
          git add .SRCINFO
        fi

        git commit -m "$COMMIT_MESSAGE" || true

        if [[ "$FORCE_PUSH" == "true" ]]; then
          git push origin master --force
        else
          git push origin master
        fi

    - name: Verify deployment succeeded
      if: steps.aur_action.outcome == 'failure' && steps.aur_manual.outcome == 'failure'
      shell: bash
      env:
        PKGNAME: ${{ inputs.pkgname }}
      run: |
        echo "::error::Both deployment paths failed for $PKGNAME"
        exit 1