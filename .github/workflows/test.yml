name: Unit Tests
on:
  workflow_call:

  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{matrix.os}}-tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}

      - name: Setup .NET environment
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props
            **/Directory.Build.props

      - name: Restore dependencies
        run: dotnet restore OpenSSH_GUI.slnx

      - name: Build solution
        run: dotnet build OpenSSH_GUI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test OpenSSH_GUI.slnx --configuration Release --no-build --verbosity normal
