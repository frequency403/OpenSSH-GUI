name: Unit Tests
on:
  workflow_call: 
    
  push:
    branches-ignore:
      - master
      - development
      - 'release/**'
  pull_request: 
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{matrix.os}}-tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macOS-latest ]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup .NET environment
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/Directory.Packages.props
            **/Directory.Build.props

      - name: Restore dependencies
        run: dotnet restore OpenSSH_GUI.slnx

      - name: Build solution
        run: dotnet build OpenSSH_GUI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test OpenSSH_GUI.slnx --configuration Release --no-build --verbosity normal
