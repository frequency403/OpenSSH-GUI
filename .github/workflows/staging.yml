name: staging.yml
on:
  push:
    branches:
      - 'development'
    paths:
      - 'openssh-gui-git/PKGBUILD'
concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  aur_publish:
    name: Update GIT AUR package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:       
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with: 
        fetch-depth: '1'
        sparse-checkout: |
          openssh-gui-git/PKGBUILD
        ref: ${{ github.ref }}
    - name: Deploy
      uses: KSXGitHub/github-actions-deploy-aur@da03e160361ce01bf087e790b6ffd196d7dccff7 # v4.1.3
      with:
        pkgname: openssh-gui-git
        pkgbuild: openssh-gui-git/PKGBUILD
        commit_username: ${{ github.repository_owner }}
        commit_email: ${{ github.repository_owner }}@users.noreply.github.com
        ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        commit_message: ${{ github.event.head_commit.message }}
        allow_empty_commits: true