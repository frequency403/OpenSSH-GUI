name: Version Guard (release -> master)

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    if: startsWith(github.event.pull_request.head.ref, 'release/')
    outputs:
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Checkout target (master)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0

      - name: Extract master version
        id: master_version
        uses: ./.github/actions/determine-version


      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Extract release version
        id: release_version
        uses: ./.github/actions/determine-version

      - name: Compare versions
        shell: bash
        # The release version is read from the PR branch - pass it via env, never inline into scripts.
        env:
          MASTER: ${{ steps.master_version.outputs.version }}
          RELEASE: ${{ steps.release_version.outputs.version }}
        run: |
          echo "Master:  $MASTER"
          echo "Release: $RELEASE"

          python3 - << 'PYEOF'
          import os
          import sys
          from packaging.version import Version

          master = Version(os.environ["MASTER"])
          release = Version(os.environ["RELEASE"])

          if release <= master:
              print(f"Release version {release} must be greater than master {master}")
              sys.exit(1)

          print("Version check passed")
          PYEOF
